<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>【占位·网页标题】</title>
<style>
/* ============ 0. 全局：越花越乱越带劲 ============ */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:"Comic Sans MS","华文琥珀","华文彩云","微软雅黑",sans-serif;
  background-color:#000;color:#0f0;
  overflow-x:hidden;cursor:crosshair;
  padding:0 8px 160px;
  
  /* 【特效调整】：7s 是背景颜色循环变色的速度，数字越小闪得越快 */
  animation:bgPulse 7s linear infinite; 
  
  overflow-wrap:break-word;
  word-break:break-word;
}

/* 【特效调整】：这里控制背景变色的具体颜色，可换成你喜欢的色号 */
@keyframes bgPulse{
  0%{background-color:#000}20%{background-color:#2a0033}40%{background-color:#003322}
  60%{background-color:#332200}80%{background-color:#00223a}100%{background-color:#000}
}

/* 会动的"泥点子"背景 */
#tile{
  position:fixed;inset:-10%;z-index:-1;
  opacity:.22; /* 【特效调整】：背景泥点子的不透明度，0~1，越小越暗 */
  pointer-events:none;
  background-image:
    radial-gradient(#ff00ff 3px,transparent 4px),
    radial-gradient(#00ffff 3px,transparent 4px),
    radial-gradient(#ffff00 2px,transparent 3px);
  background-size:60px 60px,90px 90px,40px 40px;
  background-position:0 0,30px 30px,15px 5px;
  
  /* 【特效调整】：3s 是泥点子背景滚动的速度，数字越小滚得越快 */
  animation:tileMove 3s linear infinite;
}
@keyframes tileMove{to{background-position:60px 60px,120px 120px,55px 45px}}

/* ============ 1. 文字特效 ============ */
.rainbow{
  /* 【特效调整】：.6s 是主标题变色速度，.15s 是主标题抖动速度 */
  animation:rainbow .6s steps(1) infinite, shake .15s infinite;
  
  font-size:clamp(28px,7vw,72px); /* 主标题基础大小 */
  font-weight:900;line-height:1.15;
  text-align:center;margin:14px 0;letter-spacing:2px;
  
  -webkit-text-stroke:2px #000; /* 【特效调整】：主标题描边粗细，改成 0px 就是不要描边 */
}
@keyframes rainbow{
  /* 【特效调整】：这里的 text-shadow:4px 4px 0 是文字的彩色阴影厚度，数字越大越粗犷 */
  0%{color:#f00;text-shadow:4px 4px 0 #0ff}
  17%{color:#ff0;text-shadow:4px 4px 0 #f0f}
  33%{color:#0f0;text-shadow:4px 4px 0 #00f}
  50%{color:#0ff;text-shadow:4px 4px 0 #f00}
  67%{color:#00f;text-shadow:4px 4px 0 #ff0}
  83%{color:#f0f;text-shadow:4px 4px 0 #0f0}
  100%{color:#f00;text-shadow:4px 4px 0 #0ff}
}
.blink{animation:blink .8s steps(1) infinite;}
@keyframes blink{50%{opacity:0}}

.shake{display:inline-block;animation:shake .16s infinite;}
@keyframes shake{
  /* 【特效调整】：这里控制标题/文字的抖动幅度，translate 是位移，rotate 是旋转角度 */
  0%{transform:translate(0,0) rotate(-1deg)}
  25%{transform:translate(2px,-2px) rotate(1.5deg)}
  50%{transform:translate(-2px,1px) rotate(-2deg)}
  75%{transform:translate(1px,2px) rotate(1deg)}
  100%{transform:translate(0,0) rotate(-1deg)}
}

.wordart{
  display:inline-block;font-size:clamp(22px,5vw,44px);font-weight:900;
  color:#ff0;
  
  /* 【特效调整】：skew(-8deg) 是文字向左倾斜的角度，rotate(-2deg) 是整体旋转角度 */
  transform:skew(-8deg) rotate(-2deg);
  
  /* 【特效调整】：文字的三层彩色阴影，数字越大阴影越厚 */
  text-shadow:2px 2px 0 #f0f,4px 4px 0 #0ff,6px 6px 0 #000;
  padding:4px 10px;
}

.giant{font-size:clamp(40px,13vw,140px);} /* 超大字体的尺寸 */
.lime{color:#0f0}.magenta{color:#f0f}.cyan{color:#0ff}.yellow{color:#ff0}
#mainTitle,#subTitle,#bigName{
  max-width:100%;
  overflow-wrap:anywhere;
}

/* ============ 2. 滚动字幕 ============ */
marquee{
  display:block;margin:12px 0;padding:8px 0;
  background:linear-gradient(90deg,#ff0,#f0f,#0ff,#0f0,#ff0);
  color:#000;font-weight:900;font-size:clamp(16px,3.4vw,30px);
  border-top:6px dashed #f00;border-bottom:6px dashed #00f;
}

/* ============ 3. 歪掉的卡片 ============ */
.card{
  max-width:900px;margin:26px auto;padding:18px 16px;
  background:repeating-linear-gradient(45deg,#111 0 12px,#1a1a1a 12px 24px);
  border:8px double #0ff;
  box-shadow:10px 10px 0 #f0f,-10px -10px 0 #ff0;
  
  /* 【特效调整】：rotate(-1.2deg) 是奇数卡片的倾斜角度 */
  transform:rotate(-1.2deg);
  text-align:center;
}
.card:nth-of-type(even){
  /* 【特效调整】：rotate(1.6deg) 是偶数卡片的倾斜角度，和上面的角度相反 */
  transform:rotate(1.6deg);
  border-color:#ff0;
  box-shadow:-10px 10px 0 #0f0,10px -10px 0 #f00;
}
.card p{font-size:clamp(15px,2.6vw,22px);line-height:1.85;color:#fff;margin:10px 0;}
.tagline{font-size:clamp(18px,4vw,34px);font-weight:900;color:#ff0;}

/* ============ 4. 按钮 ============ */
.btn{
  display:inline-block;margin:6px;padding:14px 22px;
  font-family:inherit;font-size:clamp(15px,2.6vw,22px);font-weight:900;
  color:#000;background:#ff0;border:5px outset #f0f;
  cursor:pointer;box-shadow:6px 6px 0 #00f;
  
  /* 【特效调整】：.5s 是按钮默认抖动的速度，如果觉得太晃眼可以去掉这个属性 */
  animation:shake .5s infinite;
}
.btn:hover{background:#0ff;box-shadow:2px 2px 0 #f00;animation:none;}
.btn:active{transform:translate(4px,4px);box-shadow:none;}

/* ============ 5. 弹窗广告 ============ */
.ad{
  position:fixed;z-index:60;width:min(290px,72vw);
  padding:30px 12px 14px;
  background:#ff0;color:#000;border:6px ridge #f00;
  font-weight:900;font-size:15px;text-align:center;
  box-shadow:8px 8px 0 rgba(0,0,0,.6);
  
  /* 【特效调整】：.9s 是广告窗口持续扭动呼吸的速度 */
  animation:adJiggle .9s infinite alternate;
}
@keyframes adJiggle{
  /* 【特效调整】：广告扭动的幅度，2deg / 2.5deg 是旋转，1.03 是放大的比例 */
  from{transform:rotate(-2deg) scale(1)}
  to{transform:rotate(2.5deg) scale(1.03)}
}
.ad .close{
  position:absolute;top:6px;right:6px;
  width:26px;height:26px;border-radius:50%;
  border:3px solid #000;background:#f00;color:#fff;
  font-weight:900;font-size:14px;line-height:20px;text-align:center;
  cursor:pointer;z-index:2;
}

/* ============ 6. 假计数器 & 施工条 ============ */
.counter{
  display:inline-block;background:#000;border:4px inset #0f0;color:#f00;
  font-family:"Courier New",monospace;font-size:26px;font-weight:900;
  letter-spacing:3px;padding:4px 12px;
}
.pole{
  height:26px;border:4px solid #000;
  background:repeating-linear-gradient(45deg,#ff0 0 18px,#000 18px 36px);
  background-size:51px 51px;
  
  /* 【特效调整】：.8s 是黄黑警示条滚动的速度 */
  animation:poleMove .8s linear infinite;
}
@keyframes poleMove{to{background-position:51px 0}}

/* ============ 7. 粒子 & 提示条 ============ */
.trail{
  position:fixed;z-index:99;pointer-events:none;font-size:22px;
  /* 【特效调整】：.9s 是鼠标拖尾表情消失的动画时间 */
  animation:trailFade .9s linear forwards;
}
@keyframes trailFade{
  to{transform:translateY(40px) rotate(180deg) scale(.2);opacity:0}
}
.burst{position:fixed;z-index:99;pointer-events:none;font-size:30px;}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;
  max-width:88vw;padding:12px 18px;background:#000;color:#0f0;
  border:6px dashed #f0f;font-weight:900;
  font-size:clamp(14px,2.4vw,20px);text-align:center;
}
footer{text-align:center;color:#888;font-size:13px;margin:40px 0 0;}

/* ============ 8. 响应式排版修复 ============ */
.btn-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap: 10px;
  margin: 24px auto;
  max-width: 1000px;
  padding: 0 16px;
}
.btn-row .btn{
  margin: 0;
  flex: 0 1 auto;
  white-space: nowrap;
}

.ad{max-width:calc(100vw - 24px);}

body{
  padding-left:max(8px, env(safe-area-inset-left));
  padding-right:max(8px, env(safe-area-inset-right));
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
}

@media (max-width:768px){
  .card{padding:14px 12px;margin:20px auto;}
}

@media (max-width:480px){
  .rainbow{
    letter-spacing:0;
    -webkit-text-stroke:1px #000;
    font-size:clamp(22px,8.5vw,48px);
  }
  .giant{font-size:clamp(28px,10.5vw,56px);}
  .wordart{
    text-shadow:1px 1px 0 #f0f,2px 2px 0 #0ff,3px 3px 0 #000;
    transform:skew(-6deg) rotate(-1.5deg);
  }
  .card,
  .card:nth-of-type(even){
    transform:none;
    padding:12px 10px;
    margin:16px auto;
    border-width:5px;
    box-shadow:4px 4px 0 #f0f,-4px -4px 0 #ff0;
    width:calc(100% - 4px);
  }
  .card p{line-height:1.7;}
  .tagline{font-size:clamp(15px,5vw,22px);}
  .counter{font-size:clamp(16px,6vw,24px);letter-spacing:1px;}
  
  .btn-row{gap: 8px; padding: 0 8px;}
  .btn{
    font-size:clamp(12px,3.6vw,16px);
    padding:10px 12px;
    border-width:4px;
    box-shadow:4px 4px 0 #00f;
  }
  
  .ad{
    padding:28px 10px 10px;
    font-size:13px;
  }
  .ad .close{
    width:26px;height:26px;
    line-height:20px;
    font-size:14px;
  }
  .toast{
    padding:10px 12px;
    bottom:max(16px, env(safe-area-inset-bottom));
    max-width:92vw;
  }
  #tile{background-size:40px 40px,60px 60px,28px 28px;}
  marquee{font-size:clamp(14px,4vw,22px);}
}

@media (max-width:340px){
  .btn{font-size:12px;padding:8px 10px;border-width:3px;}
  marquee{font-size:13px;}
  .rainbow{font-size:clamp(20px,8vw,36px);}
  .giant{font-size:clamp(24px,9.5vw,44px);}
  .counter{font-size:15px;letter-spacing:0;}
}

@media (hover:none),(pointer:coarse){
  .trail{font-size:16px;}
  .burst{font-size:22px;}
}
</style>
</head>
<body>
<div id="tile"></div>

<div class="rainbow giant" id="mainTitle">【占位·主标题】</div>
<div style="text-align:center">
  <span class="wordart" id="subTitle">【占位·副标题】</span>
</div>

<marquee behavior="alternate" scrollamount="14" id="marqueeAlt">【占位·来回横跳字幕】</marquee>
<marquee direction="right" scrollamount="20" id="marqueeRight">【占位·逆向狂奔字幕】</marquee>

<div style="text-align:center;margin:10px 0">
  <span class="giant shake lime" id="bigName">【占位·主角名字】</span>
</div>

<div id="cards"></div>

<!-- ===== 按钮区 ===== -->
<div class="btn-row">
  <button class="btn" id="btnSpeak">🔊 大声朗读</button>
  <button class="btn" id="btnBgm">🎵 播放土味BGM</button>
  <button class="btn" id="btnMore">💥 再来一句</button>
  <button class="btn" id="btnAd">📢 弹个广告</button>
  <button class="btn" id="btnReset">🧹 清屏</button>
</div>

<!-- ===== 左下角修复区 ===== -->
<!-- 用 Flex 强制垂直和水平居中，彻底解决跑偏靠左的问题 -->
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin-top: 18px; margin-bottom: 18px; text-align: center;">
  <div>
    <span class="yellow blink">本页总访问量：</span>
    <span class="counter" id="counter">0000283</span>
  </div>
  <div class="blink magenta" style="margin-top: 6px; font-weight: 900;">🦺 本网页正在施工中 · 请勿靠近 🦺</div>
  <div class="pole" style="width: 100%; max-width: 900px; margin: 8px auto;"></div>
</div>

<footer>© 【2026】 【LGBT研究院🏳️‍🌈】 · 本页最佳浏览分辨率 800×600 · 建议使用 IE6 观看</footer>

<script>
// ===============================================================
// ★★★ 只改这一块就行：所有文案、数字、设定都在 CONFIG 里 ★★★
// ===============================================================
const CONFIG = {
  title:       "【震 惊 全 网】",          // 网页大标题
  subTitle:    "【超级福瑞控武昭宇】",      // 副标题
  bigName:     "【武昭宇居然是同性恋】",    // 中间巨大的名字
  marqueeAlt:  "【隐藏了14年终于被发现】",  // 来回滚动字幕
  marqueeRight:"【有114514个扫福瑞与其战斗失败】", // 逆向滚动字幕
  speakText:   "扫福瑞",                  // 点“大声朗读”朗读的内容

  // 自定义 BGM 音频（已经为你填入 audio/music.mp3）
  // 部署在 GitHub 的话填 "music.mp3"，不要以 / 开头。留空则播放默认土味电子音。
  audioSrc:    "audio/music.mp3", 
  audioVolume: 0.8,   // 音量 0 ~ 1
  audioLoop:   false, // 是否循环播放

  // 卡片内容：你想写多少条就写多少条，逗号别丢
  lines: [
    "【据不愿透露姓名的人士透露……】",
    "【根据有武昭宇 Blued好友的透露】",
    "【根据他的朋友透露】",
    "【根据武昭宇的群U透露】",
    "【根据猫咖工作人员说明】"
  ],
  // 对应上面的卡片底部的黄字
  footers: [
    "【武昭宇是同性恋】",
    "【很帅很嫩很乖】",
    "【在学校大家都知道他是gay】",
    "【武昭宇去KTV抽因】",
    "【武昭宇是猫条】"
  ],
  // 点“再来一句”随机吐出来的短句池
  pool: [
    "【武昭宇很嫩很肥美】",
    "【帅呆了】",
    "【大战300回合不曾落败】",
    "【很舒服】",
    "【平板支撑第9178天】"
  ],
  // 弹窗广告的文案
  ads: [
    "【点击就送屠龙宝刀】",
    "【开局一条狗，装备全靠捡】"
  ],
  // 鼠标拖尾 / 点击爆炸用的表情
  emojis: ["💥", "🌈", "⭐", "🐟", "🏳️‍🌈", "👑", "❗"],

  // 底部提示条文字
  tips: {
    adClosed: "广告已关闭，但这份粗糙永存。",
    cleaned:  "清屏完成，风格依旧相当野生。",
    musicOn:  "土味 BGM 已启动，音量请自行忍受。",
    musicOff: "BGM 已停，世界安静了。",
    musicFail:"提示你的浏览器不肯出声（AudioContext 不可用）。",
    audioError:"音频加载失败，已回退到土味 BGM。检查路径与大小写。"
  },

  bgmNotes: [523, 659, 784, 659], // 土味 BGM 的音高（Hz），随便改
  visitorStart: 12345             // 假访问量起始值
};

// ===============================================================
// 下面是页面逻辑，不改 CONFIG 的话不需要动
// ===============================================================
(function () {
  const $ = function (id) { return document.getElementById(id); };
  const pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  const pad = function (n) { return String(n).padStart(6, "0"); };

  // 【特效调整】：鼠标/手指滑动时产生拖尾的灵敏度（数值越大，生成得越稀疏）
  const isCoarse = window.matchMedia("(pointer:coarse)").matches;
  const TRAIL_GAP = isCoarse ? 120 : 60; // 手机上是120，电脑上是60
  
  // 【特效调整】：每次点击爆炸产生的表情数量
  const BURST_COUNT = isCoarse ? 6 : 10; // 手机爆炸6个，电脑爆炸10个

  // 填字
  document.title = CONFIG.title.replace(/[【】]/g, "");
  $("mainTitle").textContent    = CONFIG.title;
  $("subTitle").textContent     = CONFIG.subTitle;
  $("bigName").textContent      = CONFIG.bigName;
  $("marqueeAlt").textContent   = CONFIG.marqueeAlt + "　　" + CONFIG.marqueeAlt;
  $("marqueeRight").textContent = CONFIG.marqueeRight + "　　" + CONFIG.marqueeRight;

  // 大标题自适应
  function autoFit(el, minPx) {
    el.style.whiteSpace = "nowrap";
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize) || 16;
    const min = minPx || 16;
    let guard = 0;
    while (size > min && el.scrollWidth > el.clientWidth + 0.5 && guard++ < 400) {
      size -= 1;
      el.style.fontSize = size + "px";
    }
    if (el.scrollWidth > el.clientWidth + 0.5) {
      el.style.whiteSpace = "normal";
      el.style.fontSize = min + "px";
    }
  }
  function fitTitles() {
    autoFit($("mainTitle"), 22);
    autoFit($("subTitle"),  14);
    autoFit($("bigName"),   20);
  }
  fitTitles();

  let fitTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(fitTitles, 120);
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitTitles);
  }

  // 生成卡片
  const cardBox = $("cards");
  CONFIG.lines.forEach(function (text, i) {
    const card = document.createElement("div");
    card.className = "card";

    const tag1 = document.createElement("div");
    tag1.className = "tagline";
    tag1.textContent = "第 " + (i + 1) + " 条";

    const p = document.createElement("p");
    p.textContent = text;

    const tag2 = document.createElement("div");
    tag2.className = "tagline blink";
    tag2.textContent = CONFIG.footers[i] || CONFIG.bigName;

    card.appendChild(tag1);
    card.appendChild(p);
    card.appendChild(tag2);
    cardBox.appendChild(card);
  });

  // 假计数器
  let hits = CONFIG.visitorStart;
  const counter = $("counter");
  counter.textContent = pad(hits);
  // 【功能调整】：这里控制访问量增加的速度，800 是 0.8 秒加一次，改小加得快
  setInterval(function () {
    hits += 1 + Math.floor(Math.random() * 7);
    counter.textContent = pad(hits);
  }, 800);

  // 鼠标拖尾
  let lastTrail = 0;
  document.addEventListener("pointermove", function (e) {
    const now = Date.now();
    if (now - lastTrail < TRAIL_GAP) { return; }
    lastTrail = now;
    const s = document.createElement("span");
    s.className = "trail";
    s.textContent = pick(CONFIG.emojis);
    s.style.left = (e.clientX - 10) + "px";
    s.style.top = (e.clientY - 10) + "px";
    document.body.appendChild(s);
    // 【功能调整】：900 是拖尾表情在屏幕上的存活时间（毫秒），改大消失得慢
    setTimeout(function () { s.remove(); }, 900);
  });

  // 点击爆炸
  document.addEventListener("click", function (e) {
    for (let i = 0; i < BURST_COUNT; i++) {
      const s = document.createElement("span");
      s.className = "burst";
      s.textContent = pick(CONFIG.emojis);
      s.style.left = (e.clientX - 15) + "px";
      s.style.top = (e.clientY - 15) + "px";
      const ang = Math.random() * Math.PI * 2;
      
      // 【特效调整】：dist 控制爆炸时飞溅的散开距离（60~220像素）
      const dist = 60 + Math.random() * 160; 
      
      s.animate([
        { transform: "translate(0,0) rotate(0deg) scale(1)", opacity: 1 },
        {
          transform: "translate(" + Math.cos(ang) * dist + "px," +
                     Math.sin(ang) * dist + "px) rotate(" +
                     (Math.random() * 720 - 360) + "deg) scale(.4)",
          opacity: 0
        }
      ], { duration: 900, easing: "ease-out" }); // 这里的 900 是爆炸动画持续时长
      document.body.appendChild(s);
      setTimeout(function () { s.remove(); }, 900);
    }
    // 点击时 30% 的概率弹出一句台词
    if (Math.random() < 0.3) { toast(pick(CONFIG.pool)); }
  });

  // Toast（底部提示）
  let toastTimer = null;
  function toast(msg) {
    let el = document.querySelector(".toast");
    if (!el) {
      el = document.createElement("div");
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    clearTimeout(toastTimer);
    // 【功能调整】：2400 是底部提示条停留的时长（毫秒）
    toastTimer = setTimeout(function () { el.remove(); }, 2400);
  }

  // 弹窗广告
  let adSeed = 0;
  function adSpot(i) {
    const margin = 20; // 广告距离屏幕边缘的最小距离（像素）
    const adW = Math.min(290, window.innerWidth * 0.72) + 20;
    const adH = Math.min(180, window.innerHeight * 0.35);

    const maxX = Math.max(margin, window.innerWidth - adW - margin);
    const maxY = Math.max(margin + 40, window.innerHeight - adH - margin);

    const spots = [
      { x: margin,   y: margin + 40 },
      { x: maxX,     y: margin + 60 },
      { x: maxX / 2, y: maxY },
      { x: maxX / 2, y: margin + 20 },
      { x: maxX,     y: maxY }
    ];
    const s = spots[i % spots.length];
    return {
      x: Math.max(margin, Math.min(s.x, maxX)),
      y: Math.max(margin + 40, Math.min(s.y, maxY))
    };
  }

  function clampAd(ad) {
    const margin = 20;
    const rect = ad.getBoundingClientRect();
    let left = parseFloat(ad.style.left) || 0;
    let top = parseFloat(ad.style.top) || 0;

    if (left + rect.width > window.innerWidth - margin) {
      left = window.innerWidth - rect.width - margin;
    }
    if (top + rect.height > window.innerHeight - margin) {
      top = window.innerHeight - rect.height - margin;
    }
    if (left < margin) { left = margin; }
    if (top < margin) { top = margin; }

    ad.style.left = left + "px";
    ad.style.top = top + "px";
  }

  function spawnAd(text) {
    const ad = document.createElement("div");
    ad.className = "ad";
    const spot = adSpot(adSeed++);
    ad.style.left = spot.x + "px";
    ad.style.top = spot.y + "px";

    const close = document.createElement("div");
    close.className = "close";
    close.textContent = "×";
    // 修复：点击一次直接关闭
    close.addEventListener("click", function (ev) {
      ev.stopPropagation();
      ad.remove();
      toast(CONFIG.tips.adClosed);
    });

    const line1 = document.createElement("div");
    line1.textContent = "🙈 关闭按钮在哪？";
    line1.style.fontSize = "12px";

    const line2 = document.createElement("div");
    line2.textContent = text;
    line2.style.marginTop = "4px";

    ad.appendChild(close);
    ad.appendChild(line1);
    ad.appendChild(line2);
    document.body.appendChild(ad);

    requestAnimationFrame(function () { clampAd(ad); });
    return ad;
  }

  window.addEventListener("resize", function () {
    document.querySelectorAll(".ad").forEach(function (ad) {
      clampAd(ad);
    });
  });

  // 【功能调整】：下面两个数字 1200 和 3000 表示打开网页后多少毫秒弹出第一批广告
  setTimeout(function () { spawnAd(CONFIG.ads[0]); }, 1200);
  setTimeout(function () { spawnAd(pick(CONFIG.ads)); }, 3000);

  // 按钮
  $("btnSpeak").addEventListener("click", function () {
    if (!("speechSynthesis" in window)) {
      toast("你的浏览器不肯开口");
      return;
    }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(CONFIG.speakText);
    u.lang = "zh-CN";
    
    // 【功能调整】：朗读语速和音调 (rate 是语速，pitch 是音调)
    u.rate = 1; 
    u.pitch = 1.4;
    
    u.volume = 1;
    window.speechSynthesis.speak(u);
  });

  $("btnMore").addEventListener("click", function () { toast(pick(CONFIG.pool)); });
  $("btnAd").addEventListener("click", function () { spawnAd(pick(CONFIG.ads)); });

  // BGM 播放逻辑
  const btnBgm = $("btnBgm");
  const audioList = (function () {
    const s = CONFIG.audioSrc;
    if (!s) return [];
    return (Array.isArray(s) ? s : [s]).filter(Boolean);
  })();
  const hasCustomAudio = audioList.length > 0;

  let actx = null;
  let bgmTimer = null;
  let customAudio = null;
  let audioIdx = 0;

  function setAudioSrc() {
    customAudio.src = encodeURI(audioList[audioIdx]);
  }

  function stopTone() {
    if (bgmTimer) {
      clearInterval(bgmTimer);
      bgmTimer = null;
    }
  }

  function playTone() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") { actx.resume(); }
      let i = 0;
      const play = function () {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = "square";
        osc.frequency.value = CONFIG.bgmNotes[i % CONFIG.bgmNotes.length];
        // 【功能调整】：0.06 是土味BGM的音量，越小越轻
        gain.gain.value = 0.06; 
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + 0.22);
        i++;
      };
      play();
      // 【功能调整】：260 是土味BGM的音符切换速度，越小越急促
      bgmTimer = setInterval(play, 260);
      toast(CONFIG.tips.musicOn);
    } catch (err) {
      toast(CONFIG.tips.musicFail);
    }
  }

  function initCustomAudio() {
    customAudio = new Audio();
    customAudio.preload = "metadata";
    customAudio.volume = typeof CONFIG.audioVolume === "number"
      ? Math.max(0, Math.min(1, CONFIG.audioVolume))
      : 0.8;
    customAudio.loop = !!CONFIG.audioLoop && audioList.length === 1;

    customAudio.addEventListener("play", function () {
      stopTone();
      toast("BGM 已启动");
    });
    customAudio.addEventListener("ended", function () {
      if (audioList.length > 1 && !CONFIG.audioLoop) {
        audioIdx = (audioIdx + 1) % audioList.length;
        setAudioSrc();
        const p = customAudio.play();
        if (p && p.catch) { p.catch(function () {}); }
      }
    });
    customAudio.addEventListener("error", function () {
      toast(CONFIG.tips.audioError);
      customAudio = null;
      playTone();
    });
  }

  function stopAllBgm() {
    stopTone();
    if (customAudio && !customAudio.paused) {
      customAudio.pause();
    }
  }

  btnBgm.addEventListener("click", function () {
    if (hasCustomAudio) {
      if (!customAudio) {
        initCustomAudio();
      }
      if (customAudio.paused) {
        if (!customAudio.getAttribute("src")) {
          audioIdx = Math.min(audioIdx, audioList.length - 1);
          setAudioSrc();
        }
        const p = customAudio.play();
        if (p && p.catch) { p.catch(function () {}); }
      } else {
        customAudio.pause();
        toast(CONFIG.tips.musicOff);
      }
    } else {
      if (bgmTimer) {
        stopTone();
        toast(CONFIG.tips.musicOff);
      } else {
        playTone();
      }
    }
  });

  // 清屏按钮
  $("btnReset").addEventListener("click", function () {
    stopAllBgm();
    setTimeout(function () {
      document.querySelectorAll(".ad,.toast,.burst,.trail").forEach(function (n) {
        n.remove();
      });
      toast(CONFIG.tips.cleaned);
    }, 0);
  });
})();
</script>
</body>
</html>
